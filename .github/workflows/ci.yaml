name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKERHUB_USER: petabait
  IMAGE_NAME: petabait/spring-petclinic

jobs:
  build-and-deploy:
    # Собственные раннеры через ARC (gha-runner-scale-set), заведены в
    # gitops/x-system/apps/arc-controller.yaml + gitops/charts/arc-runner-set
    # в репозитории laba. Имя ниже должно совпадать с runnerScaleSetName
    # из values.yaml того чарта.
    runs-on: arc-runner-set

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Build jar
        run: ./mvnw package -DskipTests

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

      - name: Update Helm values in Infrastructure repo
        if: github.ref == 'refs/heads/main'
        run: |
          # 1. Клонируем репозиторий с инфрой
          git clone https://${{ secrets.GH_TOKEN }}@github.com/bohdan-ihnatenko/laba.git infra
          cd infra
          
          # 2. Обновляем tag строго по пути gitops/charts/petclinic/values.yaml
          sed -i 's|tag: .*|tag: "${{ steps.tag.outputs.tag }}"|' gitops/charts/petclinic/values.yaml
          
          # 3. Пушим изменения обратно в репозиторий laba
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add gitops/charts/petclinic/values.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "ci: update petclinic image tag to ${{ steps.tag.outputs.tag }}"
            git push
          fi
